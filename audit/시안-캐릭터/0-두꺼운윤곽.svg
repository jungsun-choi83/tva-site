<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-label="납작한 그림체 시바견 캐릭터 시안 — 서 있는 자세">
<!-- 고야 · 납작한 그림체 시안 (2026-09-13)
     REPORT 13.0-b 주문서를 그대로 지켜 그렸다:
       · 면은 평평하게, 그라데이션 없음. 그림자는 재질마다 한 단계만.
       · 윤곽선 굵기 일정(4). 털을 한 올씩 그리지 않고 덩어리로.
       · 색 여섯 개 — 사이트 토큰 값 그대로 (#171923 #4a3f2e #8f7034 #c8a15e #c5b397 #f6f2e8).
       · 빛은 왼쪽 위에서 하나. 그늘은 전부 오른쪽에.
     지금 그림(assets/goya)의 문제 다섯 가지를 이렇게 고쳤다:
       ① 꼬리를 엉덩이에서 이어지게 그렸다 (따로 뜬 덩어리가 아니다)
       ② 팔을 셔츠보다 뒤에 두어, 소매가 어깨를 덮고 그 아래로 팔뚝이 나온다
       ③ 머리와 몸을 같은 밀도로 — 얼굴도 면 몇 개로만 이루어져 있다
       ④ 몸통을 줄이고 다리를 짧게 (사람이 아니라 강아지 비례)
       ⑤ 빛 방향이 한 장 안에서 하나 -->
<defs>
  <style>
    .ink   { fill:#171923 }
    .lit   { fill:#4a3f2e }
    .deep  { fill:#8f7034 }
    .gold  { fill:#c8a15e }
    .cloth { fill:#c5b397 }
    .cream { fill:#f6f2e8 }
    .o     { stroke:#171923; stroke-width:4; stroke-linejoin:round; stroke-linecap:round }
    .thin  { stroke:#171923; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; fill:none }
  </style>
</defs>

<g class="o">

  <!-- ── ① 꼬리 — 엉덩이에서 솟아 한 번 말린다. 굵은 선 하나로 그려 몸과 끊기지 않는다 ── -->
  <path class="gold" d="M 258 386
    C 310 384 340 352 336 314
    C 333 286 312 272 296 280
    C 282 287 278 304 288 314
    C 296 322 310 318 310 308
    C 303 313 295 309 295 301
    C 295 291 308 286 317 295
    C 330 308 330 336 314 352
    C 298 368 280 374 254 372 Z"/>
  <path class="deep" d="M 336 314 C 340 352 310 384 258 386 L 254 372 C 280 374 298 368 314 352 C 326 340 331 327 330 314 Z"/>

  <!-- ── ④ 다리 — 짧고 굵게 ───────────────────────────────────────── -->
  <path class="gold" d="M 154 400 h 46 v 58 c 0 12 -10 20 -23 20 s -23 -8 -23 -20 Z"/>
  <path class="gold" d="M 210 400 h 46 v 58 c 0 12 -10 20 -23 20 s -23 -8 -23 -20 Z"/>
  <path class="deep" d="M 242 400 h 14 v 58 c 0 9 -6 16 -14 19 Z"/>
  <path class="cream" d="M 152 462 c 0 -9 10 -14 25 -14 s 25 5 25 14 c 0 14 -11 24 -25 24 s -25 -10 -25 -24 Z"/>
  <path class="cream" d="M 208 462 c 0 -9 10 -14 25 -14 s 25 5 25 14 c 0 14 -11 24 -25 24 s -25 -10 -25 -24 Z"/>
  <path class="thin" d="M 169 475 v 8 M 185 475 v 8 M 225 475 v 8 M 241 475 v 8"/>

  <!-- ── 반바지 ─────────────────────────────────────────────────── -->
  <path class="cloth" d="M 140 340 h 130 c 5 0 8 4 8 9 l -4 48 c 0 5 -4 9 -9 9 h -43 c -5 0 -9 -4 -9 -9 l -3 -16 -3 16 c 0 5 -4 9 -9 9 h -43 c -5 0 -9 -4 -9 -9 l -4 -48 c 0 -5 3 -9 8 -9 Z"/>
  <path class="gold" d="M 250 340 h 20 c 5 0 8 4 8 9 l -4 48 c 0 5 -4 9 -9 9 h -20 c 5 0 9 -4 9 -9 l 4 -48 c 0 -5 -3 -9 -8 -9 Z"/>


  <!-- ── ② 셔츠 — 팔 위에 그려서 소매가 어깨를 덮는다 ─────────────────── -->
  <path class="cloth" d="M 200 214
    c -30 0 -51 7 -65 19
    c -14 11 -21 25 -23 41
    l -3 24 c -1 9 5 15 14 15 h 12
    l -4 36 c -1 8 5 13 13 13 h 112
    c 8 0 14 -5 13 -13 l -4 -36 h 12
    c 9 0 15 -6 14 -15 l -3 -24
    c -2 -16 -9 -30 -23 -41
    c -14 -12 -35 -19 -65 -19 Z"/>
  <path class="gold" d="M 248 222 c 6 3 12 7 17 11 c 14 11 21 25 23 41 l 3 24 c 1 9 -5 15 -14 15 h -12 l 4 36 c 1 8 -5 13 -13 13 h -26 c 8 0 14 -5 13 -13 l -4 -36 h 12 c 9 0 15 -6 14 -15 l -3 -24 c -2 -16 -9 -30 -21 -41 Z"/>
  <path class="thin" d="M 122 300 c 15 8 29 9 40 5 M 278 300 c -15 8 -29 9 -40 5"/>
  <path class="thin" d="M 200 240 v 44"/>
  <circle class="cream" cx="200" cy="254" r="6"/>
  <circle class="cream" cx="200" cy="278" r="6"/>

  <!-- ── ② 팔 — 소매 아래에서 시작해 몸통 바깥으로 내려온다.
          위팔(검정) → 팔뚝(황갈) → 발(크림) 순서가 한눈에 이어진다 ──────── -->
  <path class="ink" d="M 132 286 C 116 292 104 308 101 328 L 96 362 C 94 375 103 386 116 388 C 129 390 140 381 142 368 L 147 336 C 150 316 145 298 132 286 Z"/>
  <path class="lit" d="M 132 286 C 116 292 104 308 101 328 L 96 362 C 94 375 103 386 116 388 C 109 385 106 378 107 370 L 113 330 C 116 311 122 296 132 286 Z"/>
  <path class="gold" d="M 116 378 c 13 2 22 14 20 27 l -3 20 c -2 13 -14 22 -27 20 c -13 -2 -22 -14 -20 -27 l 3 -20 c 2 -13 14 -22 27 -20 Z"/>
  <path class="cream" d="M 112 410 c 14 0 24 10 24 23 s -10 23 -24 23 -24 -10 -24 -23 10 -23 24 -23 Z"/>
  <path class="thin" d="M 100 432 l 9 1 M 106 419 l 6 6 M 119 417 l 2 8"/>

  <path class="ink" d="M 268 286 C 284 292 296 308 299 328 L 304 362 C 306 375 297 386 284 388 C 271 390 260 381 258 368 L 253 336 C 250 316 255 298 268 286 Z"/>
  <path class="gold" d="M 284 378 c -13 2 -22 14 -20 27 l 3 20 c 2 13 14 22 27 20 c 13 -2 22 -14 20 -27 l -3 -20 c -2 -13 -14 -22 -27 -20 Z"/>
  <path class="deep" d="M 288 379 c 12 3 19 14 17 26 l -3 20 c -2 12 -13 21 -25 20 c 7 -1 12 -6 13 -13 l 5 -33 c 2 -9 -1 -16 -7 -20 Z"/>
  <path class="cream" d="M 288 410 c -14 0 -24 10 -24 23 s 10 23 24 23 24 -10 24 -23 -10 -23 -24 -23 Z"/>
  <path class="thin" d="M 300 432 l -9 1 M 294 419 l -6 6 M 281 417 l -2 8"/>

  <!-- ── ③ 머리 — 얼굴도 면 몇 개로만. 털 한 올도 그리지 않는다 ────────── -->
  <path class="ink" d="M 120 100 C 108 66 102 38 105 24 C 124 36 152 60 168 76 Z"/>
  <path class="ink" d="M 280 100 C 292 66 298 38 295 24 C 276 36 248 60 232 76 Z"/>
  <path class="gold" d="M 129 92 C 120 66 116 48 118 38 C 131 48 150 66 160 78 Z"/>
  <path class="deep" d="M 271 92 C 280 66 284 48 282 38 C 269 48 250 66 240 78 Z"/>

  <path class="ink" d="M 200 56
    C 256 56 298 90 298 146
    C 298 184 283 213 256 230
    C 240 240 221 246 200 246
    C 179 246 160 240 144 230
    C 117 213 102 184 102 146
    C 102 90 144 56 200 56 Z"/>
  <path class="lit" d="M 200 56 C 144 56 102 90 102 146 C 102 184 117 213 144 230 C 127 211 119 186 119 154 C 119 106 150 72 200 56 Z"/>

  <path class="gold" d="M 150 156 c 19 0 33 13 33 32 s -14 31 -33 31 c -18 0 -32 -12 -33 -30 c 0 -20 14 -33 33 -33 Z"/>
  <path class="deep" d="M 250 156 c -19 0 -33 13 -33 32 s 14 31 33 31 c 18 0 32 -12 33 -30 c 0 -20 -14 -33 -33 -33 Z"/>

  <ellipse class="gold" cx="161" cy="122" rx="15" ry="11"/>
  <ellipse class="deep" cx="239" cy="122" rx="15" ry="11"/>

  <path class="cream" d="M 200 166 c 25 0 43 14 43 34 c 0 20 -18 35 -43 35 s -43 -15 -43 -35 c 0 -20 18 -34 43 -34 Z"/>
  <path class="ink" d="M 200 176 c 11 0 18 5 18 11 s -7 12 -18 12 -18 -6 -18 -12 7 -11 18 -11 Z"/>
  <path class="thin" d="M 200 199 v 9 M 200 208 c -6 8 -17 8 -21 0 M 200 208 c 6 8 17 8 21 0"/>

  <path class="ink" d="M 161 138 c 9 0 15 8 15 17 s -6 17 -15 17 -15 -8 -15 -17 6 -17 15 -17 Z"/>
  <path class="ink" d="M 239 138 c 9 0 15 8 15 17 s -6 17 -15 17 -15 -8 -15 -17 6 -17 15 -17 Z"/>
  <circle class="cream" cx="156" cy="149" r="4" stroke="none"/>
  <circle class="cream" cx="234" cy="149" r="4" stroke="none"/>
</g>
</svg>
