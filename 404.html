<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="찾으시는 주소가 없습니다. Eternal Beam 홈으로 돌아가 주세요.">
  <meta name="theme-color" content="#0d0d0f">
  <title>주소를 찾을 수 없습니다 — Eternal Beam</title>
  <link rel="icon" type="image/webp" sizes="32x32" href="assets/favicon/favicon-32.webp?v=eternal-beam-r29">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/favicon-180.png?v=eternal-beam-r29">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
  <style>
    /* 정본 styles.css 의 색·서체 변수와 같은 값을 쓴다 (privacy.html 과 동일한 뼈대) */
    :root{--ink:#171923;--muted:#55565b;--line:#d6d7db;--cobalt:#c8a15e;--cream:#f6f2e8;
      --display:"Archivo Black",Impact,"Arial Black","Pretendard Variable",Pretendard,sans-serif;--mono:"IBM Plex Mono","Pretendard Variable",Pretendard,monospace;
      --sans:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI",system-ui,sans-serif;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.75 var(--sans);
      min-height:100svh;display:grid;place-items:center;padding:clamp(24px,6vw,64px)}
    .wrap{max-width:560px;text-align:left}
    .code{font:11px/1 var(--mono);letter-spacing:.2em;color:var(--muted);margin:0 0 20px}
    h1{font:clamp(34px,7vw,64px)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 16px}
    p{margin:0 0 12px;text-wrap:pretty;word-break:keep-all}
    .links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
    .links a{display:inline-flex;align-items:center;min-height:44px;color:var(--ink);
      font:11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;
      border-bottom:1px solid currentColor}
    .links a:hover{color:var(--cobalt)}
    .links a:focus-visible{outline:2px solid var(--cobalt);outline-offset:5px}
    footer{margin-top:48px;font:11px/1.7 var(--mono);letter-spacing:.05em;color:var(--muted)}
  </style>
</head>
<body>
  <main class="wrap">
    <p class="code">ERROR 404 / NOT FOUND</p>
    <h1>주소를 찾을 수<br>없습니다.</h1>
    <p>입력하신 주소가 바뀌었거나 없어졌습니다. 아래에서 원하시는 곳으로 바로 가실 수 있습니다.</p>
    <nav class="links" aria-label="주요 이동">
      <a href="/">처음 화면</a>
      <a href="/#about">회사소개 About</a>
      <a href="/#portfolio">기록 Records</a>
      <a href="/#contact">문의 Contact</a>
      <a href="/privacy.html">개인정보 처리방침</a>
    </nav>
    <footer>
      상호 Eternal Beam (이터널빔) · 서울 Seoul
    </footer>
  </main>
</body>
</html>
